name: Pubblica su Instagram

on:
  schedule:
    # Il cron di GitHub è in UTC: 17:30 UTC = 19:30 con l'ora legale, 18:30 UTC = 19:30 senza.
    # publish.py procede solo se a Madrid è tra le 19:30 e le 21:00 e oggi non ha già pubblicato.
    - cron: "30 17 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo controllo, non pubblicare"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pubblica il prossimo post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python scripts/publish.py
      - name: Commit stato
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json
          git diff --cached --quiet || { git commit -m "Post pubblicato"; git pull --rebase; git push; }
