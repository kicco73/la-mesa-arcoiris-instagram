name: Pubblica su Instagram

on:
  schedule:
    # Il cron di GitHub è in UTC e non sempre parte: tentativi ogni 15 minuti dalle 19:00 alle 21:45 UTC.
    # publish.py procede solo se a Madrid è tra le 21:00 e le 22:30 e oggi non ha già pubblicato,
    # quindi esce un solo post al giorno, il prima possibile dopo le 21:00 (ora legale gestita).
    - cron: "0,15,30,45 19,20,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo controllo, non pubblicare"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Token
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: |
          if [ ! -f data/token.enc ]; then echo "Instagram non ancora autorizzato (manca data/token.enc): salto."; exit 0; fi
          t=$(python scripts/token_store.py print)
          echo "::add-mask::$t"
          echo "IG_ACCESS_TOKEN=$t" >> "$GITHUB_ENV"
      - name: Pubblica il prossimo post
        if: env.IG_ACCESS_TOKEN != ''
        env:
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python scripts/publish.py
      - name: Storie dell'evento pubblicato oggi
        if: env.IG_ACCESS_TOKEN != '' && (github.event_name == 'schedule' || !inputs.dry_run)
        env:
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: python scripts/publish_stories.py
      - name: Commit stato
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json data/highlights.json
          git diff --cached --quiet || { git commit -m "Post pubblicato"; git pull --rebase; git push; }
