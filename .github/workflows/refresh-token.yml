name: Rinnova token Instagram

on:
  schedule:
    - cron: "17 3 1,15 * *"  # il 1° e il 15 di ogni mese: il token dura 60 giorni
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Rinnova
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: python scripts/token_store.py refresh
      - name: Commit token cifrato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/token.enc
          git diff --cached --quiet || { git commit -m "Token Instagram rinnovato (cifrato)"; git pull --rebase; git push; }
