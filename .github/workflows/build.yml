name: Build immagini

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - data/posts.json
      - scripts/build_images.py
      - scripts/archive_meetup.py
      - data/group_album.json
      - data/highlights.json
      - scripts/build_stories.py
      - assets/**

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: Archivio eventi Meetup
        run: python scripts/export_meetup.py
        continue-on-error: true
      - name: Archivio foto originali
        run: python scripts/archive_meetup.py
      - name: Immagini 1080x1350
        run: python scripts/build_images.py
      - name: Storie highlight 1080x1920
        run: python scripts/build_stories.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images stories archive data/events.json || true
          git diff --cached --quiet || { git commit -m "Immagini aggiornate"; git pull --rebase; git push; }
