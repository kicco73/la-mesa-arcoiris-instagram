name: Pubblica storie highlight

on:
  workflow_dispatch:
    inputs:
      event_ids:
        description: "Id evento (separati da virgola); vuoto = eventi pubblicati oggi"
        required: false
        default: ""
      dry_run:
        description: "Solo controllo, non pubblicare"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Token
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: |
          if [ ! -f data/token.enc ]; then echo "Instagram non ancora autorizzato (manca data/token.enc): salto."; exit 0; fi
          t=$(python scripts/token_store.py print)
          echo "::add-mask::$t"
          echo "IG_ACCESS_TOKEN=$t" >> "$GITHUB_ENV"
      - name: Pubblica le storie
        if: env.IG_ACCESS_TOKEN != ''
        env:
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          EVENT_IDS: ${{ inputs.event_ids }}
        run: python scripts/publish_stories.py
      - name: Commit stato
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/highlights.json
          git diff --cached --quiet || { git commit -m "Storie pubblicate"; git pull --rebase; git push; }
