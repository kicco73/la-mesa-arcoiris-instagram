name: Pubblica su Instagram

on:
  schedule:
    # Avvio principale: attività programmata di Claude alle 20:00 ora di Madrid (workflow_dispatch).
    # Riserva: il cron di GitHub (in UTC, spesso in ritardo o saltato). 20:00 Madrid = 19:00 UTC
    # in ora solare, 18:00 UTC in ora legale: i tentativi coprono entrambe. publish.py procede solo
    # tra le 20:00 e le 21:30 di Madrid e se oggi non è ancora uscito un post.
    - cron: "5,20,35,50 18,19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo controllo, non pubblicare"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Token
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: |
          if [ ! -f data/token.enc ]; then echo "Instagram non ancora autorizzato (manca data/token.enc): salto."; exit 0; fi
          t=$(python scripts/token_store.py print)
          echo "::add-mask::$t"
          echo "IG_ACCESS_TOKEN=$t" >> "$GITHUB_ENV"
      - name: Pubblica il prossimo post
        if: env.IG_ACCESS_TOKEN != ''
        env:
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python scripts/publish.py
      - name: Storie dell'evento pubblicato oggi
        if: env.IG_ACCESS_TOKEN != '' && (github.event_name == 'schedule' || !inputs.dry_run)
        env:
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: python scripts/publish_stories.py
      - name: Commit stato
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json data/highlights.json
          git diff --cached --quiet || { git commit -m "Post pubblicato"; git pull --rebase; git push; }
